# Mediastack — root compose file.
# This file defines the project identity and pulls in service fragments.
# Do not add services here: add a file under compose.d/ instead
# (see docs/adding-a-service.md). User customisations belong in
# docker-compose.override.yml (gitignored, auto-loaded by compose).

name: mediastack

include:
  - compose.d/apprise.yml
  - compose.d/bazarr.yml
  - compose.d/cloudflared.yml
  - compose.d/deluge.yml
  - compose.d/ersatztv.yml
  - compose.d/flaresolverr.yml
  - compose.d/gluetun.yml
  - compose.d/jellyfin.yml
  - compose.d/jellysearch.yml
  - compose.d/lidarr.yml
  - compose.d/meilisearch.yml
  - compose.d/pihole.yml
  - compose.d/prowlarr.yml
  - compose.d/qbittorrent.yml
  - compose.d/radarr-4k.yml
  - compose.d/radarr.yml
  - compose.d/recyclarr.yml
  - compose.d/seerr.yml
  - compose.d/sonarr-anime.yml
  - compose.d/sonarr.yml
  - compose.d/traefik.yml
  - compose.d/transmission.yml
  - compose.d/wizarr.yml

networks:
  mediastack:
    name: mediastack
