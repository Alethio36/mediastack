# Mediastack — root compose file.
# This file defines the project identity and pulls in service fragments.
# Do not add services here: add a folder under services/ instead
# (see docs/adding-a-service.md). Your own services belong in
# custom/compose.d/, changes to shipped ones in custom/override.yml —
# gitignored, passed to compose by mediastack.sh on every run.

name: mediastack

include:
  - services/apprise/compose.yml
  - services/bazarr/compose.yml
  - services/cleanuparr/compose.yml
  - services/cloudflared/compose.yml
  - services/deluge/compose.yml
  - services/ersatztv/compose.yml
  - services/flaresolverr/compose.yml
  - services/gluetun/compose.yml
  - services/jellyfin/compose.yml
  - services/jellysearch/compose.yml
  - services/lidarr/compose.yml
  - services/meilisearch/compose.yml
  - services/pihole/compose.yml
  - services/prowlarr/compose.yml
  - services/qbittorrent/compose.yml
  - services/radarr-4k/compose.yml
  - services/radarr/compose.yml
  - services/recyclarr/compose.yml
  - services/seerr/compose.yml
  - services/sonarr-anime/compose.yml
  - services/sonarr/compose.yml
  - services/traefik/compose.yml
  - services/watchstate/compose.yml
  - services/navidrome/compose.yml
  - services/npm/compose.yml
  - services/audiobookshelf/compose.yml
  - services/kavita/compose.yml
  - services/lazylibrarian/compose.yml
  - services/transmission/compose.yml
  - services/wizarr/compose.yml
  - services/olivetin/compose.yml
  - services/authentik/compose.yml

networks:
  mediastack:
    name: mediastack
    # a fixed range so Traefik keeps one address: services that trust the
    # portal's username header (Navidrome) trust exactly that address.
    # Containers draw from ip_range; Traefik's address sits outside it.
    ipam:
      config:
        - subnet: ${MEDIASTACK_SUBNET:-172.31.250.0/24}
          ip_range: ${MEDIASTACK_IP_RANGE:-172.31.250.128/25}
