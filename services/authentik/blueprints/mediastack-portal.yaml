# The portal's setup, applied by authentik's worker on every start
# (compose.d/authentik.yml mounts a copy; lib/authentik.sh keeps it current).
# Values that differ per install come from the worker's environment (!Env).
#
# Household members are INTERNAL users without admin rights: authentik shows
# its app dashboard to internal users only (external users are sent to one
# default app). They join by invitation and land in `media-users`; `admins`
# is the group the gate lets into the admin tools.
version: 1
metadata:
  name: Mediastack - Portal
  labels:
    blueprints.goauthentik.io/description: "mediastack: groups, sign-up by invitation, password reset by email, the portal's name"
entries:
  # -- groups -------------------------------------------------------------
  - model: authentik_core.group
    id: group-media-users
    identifiers:
      name: media-users
    attrs:
      is_superuser: false
  - model: authentik_core.group
    id: group-admins
    identifiers:
      name: admins
    attrs:
      is_superuser: false

  # -- the portal's name --------------------------------------------------
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      branding_title: !Env [MEDIASTACK_PORTAL_TITLE, Mediastack]

  # -- sign-up by invitation ----------------------------------------------
  - model: authentik_flows.flow
    id: flow-join
    identifiers:
      slug: mediastack-join
    attrs:
      name: mediastack - join by invitation
      title: !Format ["Join %s", !Env [MEDIASTACK_PORTAL_TITLE, Mediastack]]
      designation: enrollment
      authentication: require_unauthenticated

  - model: authentik_stages_invitation.invitationstage
    id: stage-invitation
    identifiers:
      name: mediastack-join-invitation
    attrs:
      continue_flow_without_invitation: false

  - model: authentik_stages_prompt.prompt
    id: field-welcome
    identifiers:
      name: mediastack-join-welcome
    attrs:
      field_key: welcome
      label: Welcome
      type: static
      required: false
      initial_value: !Format
        - "You've been invited to %s. Choose a username and password: they are your login for every app here — the same ones in the Jellyfin app on your TV or phone. Your email is how you'll reset a forgotten password."
        - !Env [MEDIASTACK_PORTAL_TITLE, Mediastack]
      order: 0
  - model: authentik_stages_prompt.prompt
    id: field-username
    identifiers:
      name: mediastack-join-username
    attrs:
      field_key: username
      label: Username
      type: username
      required: true
      placeholder: Username
      order: 1
  - model: authentik_stages_prompt.prompt
    id: field-password
    identifiers:
      name: mediastack-join-password
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: Password
      order: 2
  - model: authentik_stages_prompt.prompt
    id: field-password-repeat
    identifiers:
      name: mediastack-join-password-repeat
    attrs:
      field_key: password_repeat
      label: Password (again)
      type: password
      required: true
      placeholder: Password (again)
      order: 3
  - model: authentik_stages_prompt.prompt
    id: field-name
    identifiers:
      name: mediastack-join-name
    attrs:
      field_key: name
      label: Your name
      type: text
      required: true
      placeholder: How you'd like to be shown
      order: 4
  - model: authentik_stages_prompt.prompt
    id: field-email
    identifiers:
      name: mediastack-join-email
    attrs:
      field_key: email
      label: Email
      type: email
      required: true
      placeholder: Yours only — the apps know you by it
      order: 5

  # a username that would collide in the apps: the stack's own accounts there
  # (Audiobookshelf's root, Jellyfin's local admin), and another person's name
  # in a different case — authentik's own check is case-sensitive, Jellyfin's
  # and Audiobookshelf's are not. And an email another account has: Kavita
  # (and ROMM) sign a portal user in as the account holding their email, so a
  # shared one would make two people one there (the name stays: it identifies
  # the existing policy)
  - model: authentik_policies_expression.expressionpolicy
    id: policy-join-username
    identifiers:
      name: mediastack-join-username-free
    attrs:
      expression: !Format
        - |
          from authentik.core.models import User
          reserved = [n.strip().lower() for n in "%s".split(",") if n.strip()]
          username = str(request.context.get("prompt_data", {}).get("username", "")).strip()
          if username.lower() in reserved or User.objects.filter(username__iexact=username).exists():
              ak_message("That username is taken. Please choose another.")
              return False
          email = str(request.context.get("prompt_data", {}).get("email", "")).strip()
          if email and User.objects.filter(email__iexact=email).exists():
              ak_message("That email is already in use. Please use your own.")
              return False
          return True
        - !Env [MEDIASTACK_RESERVED_USERNAMES, ""]

  # one page: the welcome text describes every field it sits above
  - model: authentik_stages_prompt.promptstage
    id: stage-credentials
    identifiers:
      name: mediastack-join-credentials
    attrs:
      validation_policies:
        - !KeyOf policy-join-username
      fields:
        - !KeyOf field-welcome
        - !KeyOf field-username
        - !KeyOf field-password
        - !KeyOf field-password-repeat
        - !KeyOf field-name
        - !KeyOf field-email
  # the earlier second page — removed (its binding goes with it)
  - model: authentik_stages_prompt.promptstage
    state: absent
    identifiers:
      name: mediastack-join-details

  - model: authentik_stages_user_write.userwritestage
    id: stage-write
    identifiers:
      name: mediastack-join-write
    attrs:
      user_creation_mode: always_create
      user_type: internal
      user_path_template: users/household
      create_users_group: !KeyOf group-media-users
  - model: authentik_stages_user_login.userloginstage
    id: stage-login
    identifiers:
      name: mediastack-join-login

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-join
      stage: !KeyOf stage-invitation
      order: 5
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-join
      stage: !KeyOf stage-credentials
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-join
      stage: !KeyOf stage-write
      order: 20
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-join
      stage: !KeyOf stage-login
      order: 100

  # -- password reset by email ---------------------------------------------
  # Always here; the sign-in page links to it only while email works: `wire
  # authentik` sets the link once the current SMTP settings pass `email test`.
  # authentik's example recovery flow, with mediastack's email template
  # (services/authentik/templates/) and the login throttle cleared before the
  # sign-in, as `reset-password` does.
  - model: authentik_flows.flow
    id: flow-recovery
    identifiers:
      slug: mediastack-recovery
    attrs:
      name: mediastack - password reset by email
      title: Reset your password
      designation: recovery
      authentication: require_unauthenticated
      # someone already signed in (the reset signs them in, so the same link
      # clicked again) lands on the dashboard, not on authentik's "does not
      # apply to current user" (found live); signed out, a used or expired
      # link simply starts the reset again
      denied_action: continue

  # by username or email; an unknown one gets the same "email sent" screen
  # (no account is revealed) and no email
  - model: authentik_stages_identification.identificationstage
    id: stage-recovery-identification
    identifiers:
      name: mediastack-recovery-identification
    attrs:
      user_fields: [username, email]
      pretend_user_exists: true
      show_matched_user: false
  - model: authentik_stages_email.emailstage
    id: stage-recovery-email
    identifiers:
      name: mediastack-recovery-email
    attrs:
      use_global_settings: true
      template: mediastack-password-reset.html
      subject: !Format ["Reset your %s password", !Env [MEDIASTACK_PORTAL_TITLE, Mediastack]]
      token_expiry: minutes=30
      # a deactivated account stays deactivated: deliberate, not a lockout
      activate_user_on_success: false
      recovery_max_attempts: 5
      recovery_cache_timeout: minutes=5
  - model: authentik_stages_prompt.prompt
    id: field-recovery-password
    identifiers:
      name: mediastack-recovery-password
    attrs:
      field_key: password
      label: New password
      type: password
      required: true
      placeholder: New password
      order: 0
  - model: authentik_stages_prompt.prompt
    id: field-recovery-password-repeat
    identifiers:
      name: mediastack-recovery-password-repeat
    attrs:
      field_key: password_repeat
      label: New password (again)
      type: password
      required: true
      placeholder: New password (again)
      order: 1
  - model: authentik_stages_prompt.promptstage
    id: stage-recovery-password
    identifiers:
      name: mediastack-recovery-password
    attrs:
      fields:
        - !KeyOf field-recovery-password
        - !KeyOf field-recovery-password-repeat
  - model: authentik_stages_user_write.userwritestage
    id: stage-recovery-write
    identifiers:
      name: mediastack-recovery-write
    attrs:
      user_creation_mode: never_create
  - model: authentik_stages_user_login.userloginstage
    id: stage-recovery-login
    identifiers:
      name: mediastack-recovery-login

  # coming back through the email's link: the steps before it are skipped
  # (authentik's own example policy, as it ships it)
  - model: authentik_policies_expression.expressionpolicy
    id: policy-recovery-skip-if-restored
    identifiers:
      name: mediastack-recovery-skip-if-restored
    attrs:
      expression: |
        return bool(request.context.get("is_restored", True))
  # failed sign-ins lower a reputation score that locks the LDAP path
  # (Jellyfin) out: a new password clears it, as `reset-password` does
  - model: authentik_policies_expression.expressionpolicy
    id: policy-recovery-clear-throttle
    identifiers:
      name: mediastack-recovery-clear-throttle
    attrs:
      expression: |
        from authentik.policies.reputation.models import Reputation
        user = request.context.get("pending_user")
        if user is not None:
            Reputation.objects.filter(identifier=user.username).delete()
        return True

  - model: authentik_flows.flowstagebinding
    id: binding-recovery-identification
    identifiers:
      target: !KeyOf flow-recovery
      stage: !KeyOf stage-recovery-identification
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf binding-recovery-identification
      policy: !KeyOf policy-recovery-skip-if-restored
      order: 0
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-recovery
      stage: !KeyOf stage-recovery-email
      order: 20
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-recovery
      stage: !KeyOf stage-recovery-password
      order: 30
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-recovery
      stage: !KeyOf stage-recovery-write
      order: 40
  # checked at the sign-in, after the new password is written
  - model: authentik_flows.flowstagebinding
    id: binding-recovery-login
    identifiers:
      target: !KeyOf flow-recovery
      stage: !KeyOf stage-recovery-login
      order: 100
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf binding-recovery-login
      policy: !KeyOf policy-recovery-clear-throttle
      order: 0

  # -- the first card on the dashboard ------------------------------------
  # No login behind it (an application needs no provider): it carries the
  # setup text until the apps' own cards arrive with them.
  - model: authentik_core.application
    identifiers:
      slug: mediastack-getting-started
    attrs:
      name: Getting started
      group: Start here
      meta_launch_url: !Format ["%s/if/user/", !Env [MEDIASTACK_PORTAL_URL, ""]]
      meta_publisher: !Env [MEDIASTACK_PORTAL_TITLE, Mediastack]
      meta_description: "Your username and password here work in every app. Watch: install the Jellyfin app and sign in with them. Request something new: use the Requests card and sign in with Jellyfin."
      open_in_new_tab: false

  # -- the gate: one rule for every admin tool ----------------------------
  # Traefik asks authentik (the forward-auth provider, attached to the
  # built-in outpost by `wire authentik`) about every request to a route
  # marked mediastack.auth: gate. Domain-wide: one login covers them all; the
  # application's binding lets `admins` through and nobody else.
  - model: authentik_providers_proxy.proxyprovider
    id: provider-gate
    identifiers:
      name: mediastack-gate
    attrs:
      mode: forward_domain
      external_host: !Env [MEDIASTACK_PORTAL_URL, ""]
      cookie_domain: !Env [MEDIASTACK_DOMAIN, ""]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    id: app-gate
    identifiers:
      slug: mediastack-admin-tools
    attrs:
      name: Admin tools
      provider: !KeyOf provider-gate
      # not a card itself: each gated tool gets its own card (wire authentik)
      meta_launch_url: blank://blank
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-gate
      group: !KeyOf group-admins
      order: 0

  # -- LDAP: how Jellyfin checks a password -------------------------------
  # authentik's own LDAP front door (the mediastack-ldap outpost, a member of
  # the shard). Binds run a flow with no MFA step — TV and phone apps send a
  # username and password and cannot answer a prompt — throttled against
  # password guessing. Only the search account may list the directory; only
  # media-users and admins may bind.
  #
  # The throttle: authentik keeps a score per person AND address, -1 for a
  # failed sign-in, +1 for a good one, floored at -5. Every bind arrives from
  # Traefik's fixed address, so that one score is the Jellyfin path's: at the
  # floor, the path refuses that person (until the score expires after a day,
  # or a reset clears it). Only that address counts — authentik's reputation
  # policy sums every address, and a person's web sign-ins lifted the sum past
  # the floor, letting every guess through (found live: -5 + 1 + 1). And
  # per person, so one person's typos never lock out another.
  - model: authentik_policies_expression.expressionpolicy
    id: policy-ldap-throttle
    identifiers:
      name: mediastack-ldap-throttle
    attrs:
      expression: !Format
        - |
          from django.db.models import Sum
          from authentik.policies.reputation.models import Reputation
          score = Reputation.objects.filter(identifier=request.user.username, ip="%s").aggregate(total=Sum("score"))["total"] or 0
          if score <= -5:
              ak_message("Too many wrong passwords. Wait a while, or reset it from the portal's sign-in page.")
              return False
          return True
        - !Env [MEDIASTACK_TRAEFIK_ADDRESS, "172.31.250.2"]
  # the summing reputation policy it replaces (its bindings go with it)
  - model: authentik_policies_reputation.reputationpolicy
    state: absent
    identifiers:
      name: mediastack-ldap-reputation
  - model: authentik_stages_password.passwordstage
    id: stage-ldap-password
    identifiers:
      name: mediastack-ldap-password
    attrs:
      backends:
        - authentik.core.auth.InbuiltBackend
        - authentik.core.auth.TokenBackend
  - model: authentik_stages_identification.identificationstage
    id: stage-ldap-identification
    identifiers:
      name: mediastack-ldap-identification
    attrs:
      user_fields: [username]
      password_stage: !KeyOf stage-ldap-password
  - model: authentik_stages_user_login.userloginstage
    id: stage-ldap-login
    identifiers:
      name: mediastack-ldap-login
  - model: authentik_flows.flow
    id: flow-ldap
    identifiers:
      slug: mediastack-ldap-bind
    attrs:
      name: mediastack - LDAP bind (no MFA)
      title: LDAP
      designation: authentication
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-ldap
      stage: !KeyOf stage-ldap-identification
      order: 10
  # checked at the login step, once the username is known — at the start of the
  # flow nobody is identified yet, so a check there could throttle no one
  - model: authentik_flows.flowstagebinding
    id: binding-ldap-login
    identifiers:
      target: !KeyOf flow-ldap
      stage: !KeyOf stage-ldap-login
      order: 30
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf binding-ldap-login
      policy: !KeyOf policy-ldap-throttle
      order: 0

  - model: authentik_core.user
    id: user-ldap-search
    identifiers:
      username: mediastack-ldap-search
    attrs:
      name: mediastack LDAP search (Jellyfin)
      path: services
      type: internal
      password: !Env [MEDIASTACK_LDAP_BIND_PASSWORD, ""]

  - model: authentik_providers_ldap.ldapprovider
    id: provider-ldap
    identifiers:
      name: mediastack-ldap
    attrs:
      base_dn: dc=ldap,dc=mediastack
      # the outpost runs authorization_flow as its BIND flow (the API calls it
      # bind_flow_slug) — found live: a consent flow there refused every bind
      authorization_flow: !KeyOf flow-ldap
      authentication_flow: !KeyOf flow-ldap
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # searches ask authentik live: a cached directory left a new sign-up
      # invisible to Jellyfin until the outpost's next reload (up to 5
      # minutes, found live), and a group change likewise; one API call per
      # Jellyfin sign-in.
      search_mode: direct
      # binds run authentik's real sign-in every time: a cached bind answered a
      # remembered username + password itself, past the throttle — a correct
      # guess got in at -5 while its owner had a recent Jellyfin sign-in (found
      # live) — and kept a changed password or a deactivated person working
      # for the life of the session. Jellyfin binds only at sign-in (its own
      # token after), so the cost is a slower sign-in, not slower playback.
      bind_mode: direct
      mfa_support: false
    # the full name: authentik validates a blueprint in a dry run first, where
    # the short form fails as a "global" permission (found live, 2026.8); on
    # the real apply it is still granted on this provider only
    permissions:
      - permission: authentik_providers_ldap.search_full_directory
        user: !KeyOf user-ldap-search
  - model: authentik_core.application
    id: app-ldap
    identifiers:
      slug: mediastack-ldap
    attrs:
      name: LDAP (Jellyfin)
      provider: !KeyOf provider-ldap
      meta_launch_url: blank://blank
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-ldap
      group: !KeyOf group-media-users
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-ldap
      group: !KeyOf group-admins
      order: 1
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-ldap
      user: !KeyOf user-ldap-search
      order: 2

  - model: authentik_outposts.outpost
    id: outpost-ldap
    identifiers:
      name: mediastack-ldap
    attrs:
      type: ldap
      providers:
        - !KeyOf provider-ldap
      # required by authentik even for an outpost deployed by hand (found live);
      # the address it shows for the outpost — the outpost itself reaches
      # authentik on the stack network (AUTHENTIK_HOST in compose.d/authentik.yml)
      config:
        authentik_host: !Env [MEDIASTACK_PORTAL_URL, ""]

  # -- OIDC: Audiobookshelf -----------------------------------------------
  # Its login button sends people here; its server then talks to authentik
  # (on the portal's address, which leads to Traefik inside the stack). The
  # application (with who may use it) is the household card wire keeps.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-oidc-abs
    identifiers:
      name: mediastack-oidc-audiobookshelf
    attrs:
      client_type: confidential
      # empty by default when made by a blueprint (the UI fills it in): with
      # none, authentik refuses every login as invalid_request (found live)
      grant_types: [authorization_code, refresh_token]
      client_id: mediastack-audiobookshelf
      client_secret: !Env [MEDIASTACK_ABS_CLIENT_SECRET, ""]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # RS256 with a key: Audiobookshelf checks tokens against the published keys
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/auth/openid/callback", !Env [MEDIASTACK_ABS_URL, ""]]
        - matching_mode: strict
          url: !Format ["%s/auth/openid/mobile-redirect", !Env [MEDIASTACK_ABS_URL, ""]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  # -- OIDC: Kavita -------------------------------------------------------
  # Same shape as Audiobookshelf. Kavita also asks for offline_access (it
  # refreshes its session) and reads the email: it matches an existing account
  # by email, always — so the stack's own admin has one nobody can sign up with.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-oidc-kavita
    identifiers:
      name: mediastack-oidc-kavita
    attrs:
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: mediastack-kavita
      client_secret: !Env [MEDIASTACK_KAVITA_CLIENT_SECRET, ""]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/signin-oidc", !Env [MEDIASTACK_KAVITA_URL, ""]]
        - matching_mode: strict
          url: !Format ["%s/signout-callback-oidc", !Env [MEDIASTACK_KAVITA_URL, ""]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
