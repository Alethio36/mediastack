# FlareSolverr profile: captcha bypass helper for Prowlarr indexers.

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-armour: &no-foreign-watchtower
  com.centurylinklabs.watchtower.enable: "false"

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: ${FLARESOLVERR_NAME:-mediastack-flaresolverr}
    profiles: ["flaresolverr"]
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
    labels:
      <<: *no-foreign-watchtower
      mediastack.managed: "true"
      mediastack.port: "8191"
      mediastack.desc: "captcha bypass helper for some indexers"
      mediastack.vpn: "true"
      mediastack.internal: "true"
      mediastack.config: "false"
    logging: *logging
    restart: unless-stopped
