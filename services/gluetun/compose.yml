# Gluetun: VPN gateway — all download traffic exits through this tunnel.
# Label contract for every fragment: docs/adding-a-service.md.

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-armour: &no-foreign-watchtower
  com.centurylinklabs.watchtower.enable: "false"

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: ${GLUETUN_NAME:-mediastack-gluetun}
    profiles: ["gluetun"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # Every VPN'd service publishes its UI through gluetun; those ports are
    # generated into local/vpn-overlay.yml (vpn_gen) and bind where the gate
    # says. Nothing is published here: FlareSolverr is reached in-namespace
    # (Prowlarr, on localhost:8191) and has no login, so it never gets a host
    # port; a torrent peer port on the host is unreachable from the tunnel's
    # side and only invites LAN peers past it — inbound peers need the VPN
    # provider's port forwarding, not a host mapping.
    volumes:
      - ${CONFIG_ROOT}/gluetun:/gluetun
    environment:
      - TZ=${TZ:-Etc/UTC}
      - VPN_SERVICE_PROVIDER=${VPN_PROVIDER:-nordvpn}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES:-10.5.0.2/32}
      # Server selection: comma-separated, leave unused ones empty.
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES:-}
      - SERVER_CITIES=${VPN_SERVER_CITIES:-}
      - SERVER_HOSTNAMES=${VPN_SERVER_HOSTNAMES:-}
      - UPDATER_PERIOD=24h
      # Encrypted upstream DNS (DNS over TLS), asked through the tunnel; a
      # comma-separated list spreads queries across resolvers (gluetun's wiki:
      # harder to profile). No plaintext upstream: gluetun's wiki warns a
      # private address there sends every query outside the tunnel.
      - DNS_UPSTREAM_RESOLVERS=${VPN_DNS_RESOLVERS:-cloudflare}
      # gluetun's HTTP control server: off its :8000 default (it collided with
      # apprise-api in the shared namespace) and bound to gluetun's own
      # localhost — nothing in the stack uses it, and on every address it
      # answered the whole stack network (behind a password; leak-test checks both)
      - HTTP_CONTROL_SERVER_ADDRESS=127.0.0.1:8008
    labels:
      <<: *no-foreign-watchtower
      mediastack.managed: "true"
      # routers for namespace-shared services: they have no IP of their
      # own, so their edge identity lives here with their port map
      traefik.enable: "true"
      # VPN'd service routers are generated into local/vpn-overlay.yml (vpn_gen)
      mediastack.desc: "VPN gateway — all download traffic exits through this tunnel"
      mediastack.vpn: "false"      # gluetun IS the vpn, not behind it
      mediastack.config: "true"
    # Same probe the image ships, but with a start grace: a cold tunnel can
    # take >30s to establish, and without start_period compose declares
    # gluetun unhealthy mid-handshake and aborts every dependent service.
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks: [mediastack]   # explicit: without this compose isolates gluetun
                             # on an implicit second network (mediastack_default)
    logging: *logging
    dns_search: ["."]   # no host search domain (the VPN group shares this resolv.conf): docs/adding-a-service.md
    # Docker's resolver answers the namespace's container names and forwards
    # the rest to this upstream — by default the host's own DNS, reached from
    # the host, outside the tunnel (found live Oct 2026: a short name the
    # arrs looked up left the host to the LAN router). Back to gluetun instead.
    dns: [127.0.0.1]
    restart: unless-stopped
