# Apprise: the stack's single notification hub (apprise-api).
# support: nothing yet — the stack part and doctor cover it (lib/support.sh)
# Everything notifies ONE place, tagged by audience: ops (you — errors,
# pipeline, backups, requests) and users (the household — new media, restarts,
# invites). Your real endpoints (ntfy, Discord, email, ...) are configured
# once via `wire apprise`.
#
# Outside the VPN by default: an alert that the tunnel is down must not need
# the tunnel, and posting through it would tie the address your downloads use
# to your notification account (docs/vpn-membership.md). Toggleable: `vpn
# apprise on` moves it in, and the next `up` re-points every app that
# notifies it.

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-armour: &no-foreign-watchtower
  com.centurylinklabs.watchtower.enable: "false"

services:
  apprise:
    image: lscr.io/linuxserver/apprise-api:latest
    container_name: ${APPRISE_NAME:-mediastack-apprise}
    profiles: ["apprise"]
    environment:
      - PUID=${APPRISE_UID}
      - PGID=${MEDIA_GROUP_GID:-13000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT}/apprise:/config
    labels:
      <<: *no-foreign-watchtower
      mediastack.managed: "true"
      mediastack.port: "8000"
      mediastack.desc: "one notification hub for the whole stack"
      mediastack.vpn: "false"
      mediastack.vpntoggle: "true"
      mediastack.subdomain: "notify"
      mediastack.auth: "gate"   # behind the portal (mediastack-gate)
      # no login of its own: served only through the portal; without it, on
      # this host only (127.0.0.1) — `notify` does what its UI would
      mediastack.auth.ownlogin: "false"
      mediastack.config: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs --max-time 5 http://127.0.0.1:8000/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *logging
    restart: unless-stopped
