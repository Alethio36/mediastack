# sonarr-anime: second Sonarr instance for anime — TRaSH-canonical split
# (absolute episode ordering, anime release-group scoring).
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}
x-armour: &no-foreign-watchtower
  com.centurylinklabs.watchtower.enable: "false"
services:
  sonarr-anime:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: ${SONARR_ANIME_NAME:-mediastack-sonarr-anime}
    profiles: ["sonarr-anime"]
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${SONARR_ANIME_UID}
      - PGID=${MEDIA_GROUP_GID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/sonarr-anime:/config
      - ${DATA_ROOT}:/data
    labels:
      <<: *no-foreign-watchtower
      mediastack.managed: "true"
      mediastack.desc: "second Sonarr just for anime (own library + rules)"
      mediastack.vpn: "true"
      mediastack.config: "true"
      mediastack.subdomain: "sonarr-anime"
      mediastack.port: "8990"
      mediastack.appport: "8990"
      mediastack.arrtype: "sonarr"
      mediastack.category: "tv-anime"
      mediastack.rootfolder: "/data/media/tv-anime"
      mediastack.datadirs: "torrent/tv-anime media/tv-anime"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:8990/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *logging
    restart: unless-stopped
