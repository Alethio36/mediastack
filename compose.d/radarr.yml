# Radarr: movie automation.

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-armour: &no-foreign-watchtower
  com.centurylinklabs.watchtower.enable: "false"

services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: ${RADARR_NAME:-mediastack-radarr}
    profiles: ["radarr"]
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${RADARR_UID}
      - PGID=${MEDIA_GROUP_GID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data
    labels:
      <<: *no-foreign-watchtower
      mediastack.managed: "true"
      mediastack.desc: "movie automation"
      mediastack.vpn: "true"
      mediastack.config: "true"
      mediastack.subdomain: "radarr"
      mediastack.port: "7878"
      mediastack.arrtype: "radarr"
      mediastack.category: "movies"
      mediastack.rootfolder: "/data/media/movies"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *logging
    restart: unless-stopped
