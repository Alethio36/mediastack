# Sonarr: TV show automation.

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-armour: &no-foreign-watchtower
  com.centurylinklabs.watchtower.enable: "false"

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: ${SONARR_NAME:-mediastack-sonarr}
    profiles: ["sonarr"]
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${SONARR_UID}
      - PGID=${MEDIA_GROUP_GID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data
    labels:
      <<: *no-foreign-watchtower
      mediastack.managed: "true"
      mediastack.desc: "TV show automation"
      mediastack.vpn: "true"
      mediastack.config: "true"
      mediastack.subdomain: "sonarr"
      mediastack.port: "8989"
      mediastack.arrtype: "sonarr"
      mediastack.category: "tv"
      mediastack.rootfolder: "/data/media/tv"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *logging
    restart: unless-stopped
