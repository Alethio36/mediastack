# JellySearch: Meilisearch-backed fast search for Jellyfin.
# JellySearch is a proxy, not a plugin: requests containing ?searchTerm must
# reach jellysearch:5000 instead of Jellyfin. The router below does exactly
# that — same Host as Jellyfin's router (deliberately shares JELLYFIN_HOST so
# a hostname rename keeps them aligned) plus a query matcher, at a higher
# priority so it wins. Upstream-documented rule; Traefik >= 3.0 required
# (QueryRegexp does not exist in v2).

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-armour: &no-foreign-watchtower
  com.centurylinklabs.watchtower.enable: "false"

services:
  jellysearch:
    image: domistyle/jellysearch:latest
    container_name: ${JELLYSEARCH_NAME:-mediastack-jellysearch}
    profiles: ["jellysearch"]
    # Runs as Jellyfin's identity: its whole job is reading Jellyfin's DB.
    # (The image default 1000:100 cannot read a config owned by other IDs.)
    user: "${JELLYFIN_UID}:${MEDIA_GROUP_GID}"
    depends_on:
      jellyfin:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - JELLYFIN_URL=http://jellyfin:8096
      - INDEX_CRON=${JELLYSEARCH_INDEX_CRON:-0 0 0/2 ? * * *}   # Quartz format
    volumes:
      # Official jellyfin image: DB at /config/data/jellyfin.db, so mount the
      # config root directly. (linuxserver image would need /config/data here.)
      - ${CONFIG_ROOT}/jellyfin:/config:ro
    labels:
      <<: *no-foreign-watchtower
      mediastack.managed: "true"
      traefik.enable: "true"
      traefik.http.routers.jellysearch.rule: "Host(`${JELLYFIN_HOST:-jellyfin}.${TRAEFIK_DOMAIN:-unset.invalid}`) && (QueryRegexp(`searchTerm`, `(.*?)`) || QueryRegexp(`SearchTerm`, `(.*?)`))"
      traefik.http.routers.jellysearch.entrypoints: "websecure"
      traefik.http.routers.jellysearch.tls: "true"
      traefik.http.routers.jellysearch.priority: "100"
      traefik.http.services.jellysearch.loadbalancer.server.port: "5000"
      mediastack.desc: "instant, typo-tolerant Jellyfin search"
      mediastack.vpn: "false"
      mediastack.config: "false"
    # No healthcheck: minimal .NET image, no probe tooling. Doctor checks the
    # index via meilisearch instead.
    networks: [mediastack]
    logging: *logging
    restart: unless-stopped
