# TV profile: ErsatzTV — virtual live-TV channels from your library.

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-armour: &no-foreign-watchtower
  com.centurylinklabs.watchtower.enable: "false"

services:
  # Rootful by upstream design: the official image maps no user and writes
  # /config as root. No UID entry exists for it — doctor skips the audit.
  ersatztv:
    image: ghcr.io/ersatztv/ersatztv:latest
    container_name: ${ERSATZTV_NAME:-mediastack-ersatztv}
    profiles: ["ersatztv"]
    environment:
      - TZ=${TZ}
    ports:
      - "${MEDIASTACK_GATE_BIND:-}${ERSATZTV_PORT:-8409}:8409"   # 127.0.0.1 while the portal guards it
    volumes:
      - ${CONFIG_ROOT}/ersatztv:/config
      - ${DATA_ROOT}/media:/media:ro
    labels:
      <<: *no-foreign-watchtower
      mediastack.managed: "true"
      mediastack.port: "8409"
      traefik.enable: "true"
      traefik.http.routers.ersatztv.rule: "Host(`${ERSATZTV_HOST:-tv}.${TRAEFIK_DOMAIN:-unset.invalid}`)"
      traefik.http.routers.ersatztv.entrypoints: "websecure"
      traefik.http.routers.ersatztv.tls: "true"
      traefik.http.routers.ersatztv.middlewares: "mediastack-gate@file"
      traefik.http.services.ersatztv.loadbalancer.server.port: "8409"
      mediastack.desc: "virtual live-TV channels from your library"
      mediastack.vpn: "false"
      mediastack.config: "true"
      mediastack.subdomain: "tv"
      mediastack.auth: "gate"   # an admin tool (channels are built here; households watch through Jellyfin)
    networks: [mediastack]
    logging: *logging
    restart: unless-stopped
