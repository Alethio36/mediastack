# Subs profile: Bazarr — subtitle management.

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-armour: &no-foreign-watchtower
  com.centurylinklabs.watchtower.enable: "false"

services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: ${BAZARR_NAME:-mediastack-bazarr}
    profiles: ["bazarr"]
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${BAZARR_UID}
      - PGID=${MEDIA_GROUP_GID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${DATA_ROOT}:/data
    labels:
      <<: *no-foreign-watchtower
      mediastack.managed: "true"
      mediastack.desc: "subtitle automation"
      mediastack.vpn: "true"
      mediastack.config: "true"
      mediastack.subdomain: "bazarr"
    healthcheck:
      # Bazarr has no unauthenticated /ping; a 200 on / (login page) proves up.
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:6767"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *logging
    restart: unless-stopped
