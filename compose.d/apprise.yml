# Apprise: the stack's single notification hub (apprise-api).
# Everything notifies ONE place, tagged: ops (pipeline/backups/doctor),
# activity (arr grabs/imports), users (wizarr invites). Your real endpoints
# (ntfy, Discord, email, ...) are configured once via `wire apprise`.
#
# Lives in gluetun's namespace like the arrs do: they reach it at
# localhost:8000 (container names don't resolve through gluetun's DNS), and
# outbound notifications ride the VPN. Known property: if the tunnel is hard
# down, push notifications are down with it — the script still logs locally.

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-armour: &no-foreign-watchtower
  com.centurylinklabs.watchtower.enable: "false"

services:
  apprise:
    image: lscr.io/linuxserver/apprise-api:latest
    container_name: ${APPRISE_NAME:-mediastack-apprise}
    profiles: ["apprise"]
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${APPRISE_UID}
      - PGID=${MEDIA_GROUP_GID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/apprise:/config
    labels:
      <<: *no-foreign-watchtower
      mediastack.managed: "true"
      mediastack.port: "8000"
      mediastack.desc: "one notification hub for the whole stack"
      mediastack.vpn: "true"
      mediastack.subdomain: "notify"
      mediastack.config: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs --max-time 5 http://127.0.0.1:8000/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *logging
    restart: unless-stopped
