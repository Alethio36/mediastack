# Audiobookshelf: audiobook + podcast server. Serves and streams the
# audiobooks lidarr-adjacent tooling (or you) place under the library,
# with progress sync and official mobile apps. Serving only — no wire
# role; create your account on first visit at its URL.

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-armour: &no-foreign-watchtower
  com.centurylinklabs.watchtower.enable: "false"

services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: ${AUDIOBOOKSHELF_NAME:-mediastack-audiobookshelf}
    profiles: ["audiobookshelf"]
    # The image has no entrypoint and no USER: node runs as root and PUID/PGID
    # are ignored (its own UID variables were removed in 2.4.0), so `user:`
    # sets the identity. PORT moves it off :80 — a non-root bind below 1024
    # depends on the host's ip_unprivileged_port_start (upstream #4144).
    user: "${AUDIOBOOKSHELF_UID}:${MEDIA_GROUP_GID}"
    # Network, host-port and route are generated into local/vpn-overlay.yml by
    # vpn_gen. Traefik-only (mediastack.hostport=false — no host publish).
    # Defaults OUT of the VPN; toggle with:
    #   ./mediastack.sh vpn audiobookshelf on
    environment:
      - PORT=13378
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/audiobookshelf:/config
      - ${CACHE_ROOT}/audiobookshelf:/metadata
      - ${DATA_ROOT}/media/audiobooks:/audiobooks
      - ${DATA_ROOT}/media/podcasts:/podcasts
    labels:
      <<: *no-foreign-watchtower
      mediastack.managed: "true"
      mediastack.port: "13378"
      mediastack.desc: "audiobook + podcast server with progress sync"
      mediastack.vpn: "false"
      mediastack.vpntoggle: "true"
      mediastack.hostport: "false"
      mediastack.config: "true"
      mediastack.user_facing: "true"
      mediastack.cache: "true"
      mediastack.subdomain: "audiobooks"
      mediastack.auth: "native"   # handles its own login
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=5 http://127.0.0.1:13378/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *logging
    restart: unless-stopped
