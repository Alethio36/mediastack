# Wizarr: invite links that onboard your users onto Jellyfin.
# First run is a one-time UI step (create admin, connect Jellyfin, mint an
# API key) — see README "Invites". After that: ./mediastack.sh invite

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-armour: &no-foreign-watchtower
  com.centurylinklabs.watchtower.enable: "false"

services:
  wizarr:
    image: ghcr.io/wizarrrr/wizarr:latest
    container_name: ${WIZARR_NAME:-mediastack-wizarr}
    profiles: ["wizarr"]
    environment:
      - PUID=${WIZARR_UID}
      - PGID=${MEDIA_GROUP_GID}
      - TZ=${TZ}
    ports:
      - "${WIZARR_PORT:-5690}:5690"
    volumes:
      - ${CONFIG_ROOT}/wizarr:/data/database
    labels:
      <<: *no-foreign-watchtower
      mediastack.managed: "true"
      mediastack.port: "5690"
      traefik.enable: "true"
      traefik.http.routers.wizarr.rule: "Host(`${WIZARR_HOST:-invites}.${TRAEFIK_DOMAIN:-unset.invalid}`)"
      traefik.http.routers.wizarr.entrypoints: "websecure"
      traefik.http.routers.wizarr.tls: "true"
      traefik.http.services.wizarr.loadbalancer.server.port: "5690"
      mediastack.desc: "invite links that onboard your users"
      mediastack.vpn: "false"
      mediastack.config: "true"
      mediastack.subdomain: "invites"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs --max-time 5 http://127.0.0.1:5690/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [mediastack]
    logging: *logging
    restart: unless-stopped
