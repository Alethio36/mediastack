# DNS profile: Pi-hole (v6). Optional — most deployments don't need it.
# NOTE: publishes host port 53; collides with systemd-resolved stub listeners
# and any other DNS server. `mediastack.sh doctor` checks before you hit it.

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-armour: &no-foreign-watchtower
  com.centurylinklabs.watchtower.enable: "false"

services:
  pihole:
    image: pihole/pihole:latest
    container_name: ${PIHOLE_NAME:-mediastack-pihole}
    profiles: ["dns"]
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "${PIHOLE_WEB_PORT:-83}:80/tcp"
    environment:
      - TZ=${TZ}
      # Pi-hole v6 variable (v5's WEBPASSWORD is ignored by v6 images).
      - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD}
    volumes:
      - ${CONFIG_ROOT}/pihole/config:/etc/pihole
      - ${CONFIG_ROOT}/pihole/dns:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
    labels:
      <<: *no-foreign-watchtower
      mediastack.managed: "true"
      mediastack.vpn: "false"
      mediastack.config: "true"
      mediastack.subdomain: "pihole"
    # Pi-hole ships its own image HEALTHCHECK; keep it.
    networks: [mediastack]
    logging: *logging
    restart: unless-stopped
