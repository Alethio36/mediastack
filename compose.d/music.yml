# Music profile: Lidarr.

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-armour: &no-foreign-watchtower
  com.centurylinklabs.watchtower.enable: "false"

services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: ${LIDARR_NAME:-mediastack-lidarr}
    profiles: ["lidarr"]
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${LIDARR_UID}
      - PGID=${MEDIA_GROUP_GID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/lidarr:/config
      - ${DATA_ROOT}:/data
    labels:
      <<: *no-foreign-watchtower
      mediastack.managed: "true"
      mediastack.desc: "music automation"
      mediastack.vpn: "true"
      mediastack.config: "true"
      mediastack.subdomain: "lidarr"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:8686/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *logging
    restart: unless-stopped
