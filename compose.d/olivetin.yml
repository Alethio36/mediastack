# OliveTin: the stack's web front door — a panel of buttons/dropdowns over
# mediastack.sh's safe verbs. It holds NO docker access; every action is one
# narrow SSH call to the host that lands as `sudo mediastack.sh <verb>` through
# a forced-command wrapper (see `frontdoor-install`, which writes the config,
# key and host user this unit mounts). Carries `mediastack.managed` like traefik
# so it rides the normal health-gated `update` flow (the `:latest` tag only
# moves when update runs — no-foreign-watchtower blocks out-of-band bumps). This
# also lists it in `status` and the panel's Disable dropdown: disabling it kills
# the panel itself — intentional, the operator keeps full control (see
# docs/frontdoor-safety.md).
#
# Runs as the host 'olivetin' uid (OLIVETIN_UID/GID, set by frontdoor-install)
# so it can read its key and write its own entity cache — nothing world-readable,
# non-root, no-new-privileges. Reachable over HTTPS via Traefik like every other
# service; NOT published to a host port. Enable with: ./mediastack.sh frontdoor-install

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-armour: &no-foreign-watchtower
  com.centurylinklabs.watchtower.enable: "false"

services:
  olivetin:
    image: jamesread/olivetin:latest
    container_name: ${OLIVETIN_NAME:-mediastack-olivetin}
    profiles: ["olivetin"]
    user: "${OLIVETIN_UID}:${OLIVETIN_GID}"
    environment:
      - TZ=${TZ}
      # ssh client aborts if its uid has no passwd entry; give it a home too
      - HOME=/config
    volumes:
      # whole config tree, writable — OliveTin persists sessions and themes here;
      # entity lists (entities/*.json) are written by the host refresh timer.
      - ${CONFIG_ROOT}/olivetin:/config
      # config + credentials pinned read-only on top of the writable tree
      - ${CONFIG_ROOT}/olivetin/config.yaml:/config/config.yaml:ro
      - ${CONFIG_ROOT}/olivetin/ssh/id_ed25519:/config/ssh/id_ed25519:ro
      - ${CONFIG_ROOT}/olivetin/ssh/known_hosts:/config/ssh/known_hosts:ro
      # resolves the container's uid so the ssh client's getpwuid() succeeds
      - ${CONFIG_ROOT}/olivetin/passwd:/etc/passwd:ro
    extra_hosts:
      # lets the container SSH back to the host (StrictHostKeyChecking stays on)
      - "host.docker.internal:host-gateway"
    networks: [mediastack]
    security_opt:
      - no-new-privileges:true
    # No healthcheck on purpose: the image ships no shell/wget, so a CMD-SHELL
    # probe can never exec and would peg the container 'unhealthy' forever. The
    # update health-gate treats a healthcheck-less container as pass.
    labels:
      <<: *no-foreign-watchtower
      mediastack.managed: "true"
      mediastack.port: "1337"
      traefik.enable: "true"
      traefik.http.routers.olivetin.rule: "Host(`${OLIVETIN_HOST:-panel}.${TRAEFIK_DOMAIN:-unset.invalid}`)"
      traefik.http.routers.olivetin.entrypoints: "websecure"
      traefik.http.routers.olivetin.tls: "true"
      traefik.http.services.olivetin.loadbalancer.server.port: "1337"
    logging: *logging
    restart: unless-stopped
