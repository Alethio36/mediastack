# Requests profile: Seerr — user-facing search/discovery/request UI.

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-armour: &no-foreign-watchtower
  com.centurylinklabs.watchtower.enable: "false"

services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: ${SEERR_NAME:-mediastack-seerr}
    profiles: ["seerr"]
    init: true
    # Rootless image: PUID/PGID are deliberately unsupported (the image never
    # starts as root) — the runtime identity is set here instead.
    user: "${SEERR_UID}:${MEDIA_GROUP_GID}"
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=${SEERR_LOG_LEVEL:-info}
    ports:
      - "${SEERR_PORT:-5055}:5055"
    volumes:
      - ${CONFIG_ROOT}/seerr:/app/config
      - ${CACHE_ROOT}/seerr:/app/config/cache
    labels:
      <<: *no-foreign-watchtower
      mediastack.managed: "true"
      mediastack.port: "5055"
      traefik.enable: "true"
      traefik.http.routers.seerr.rule: "Host(`${SEERR_HOST:-requests}.${TRAEFIK_DOMAIN:-unset.invalid}`)"
      traefik.http.routers.seerr.entrypoints: "websecure"
      traefik.http.routers.seerr.tls: "true"
      traefik.http.services.seerr.loadbalancer.server.port: "5055"
      mediastack.desc: "request/discovery site for your users"
      mediastack.vpn: "false"
      mediastack.config: "true"
      mediastack.cache: "true"
      mediastack.subdomain: "requests"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5055/api/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [mediastack]
    logging: *logging
    restart: unless-stopped
