# Cleanuparr: unsticks the download pipeline — strikes stalled/failed
# downloads, cleans what the arrs gave up on, blocks known-malware names.
# Wired conservatively: queue cleaning on, nothing deletes seeding torrents
# unless you turn that on yourself in its UI.

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-armour: &no-foreign-watchtower
  com.centurylinklabs.watchtower.enable: "false"

services:
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: ${CLEANUPARR_NAME:-mediastack-cleanuparr}
    profiles: ["cleanuparr"]
    environment:
      - PUID=${CLEANUPARR_UID}
      - PGID=${MEDIA_GROUP_GID}
      - TZ=${TZ}
      - PORT=11011
    ports:
      - "${CLEANUPARR_PORT:-11011}:11011"
    volumes:
      - ${CONFIG_ROOT}/cleanuparr:/config
    labels:
      <<: *no-foreign-watchtower
      mediastack.managed: "true"
      mediastack.port: "11011"
      traefik.enable: "true"
      traefik.http.routers.cleanuparr.rule: "Host(`${CLEANUPARR_HOST:-cleanup}.${TRAEFIK_DOMAIN:-unset.invalid}`)"
      traefik.http.routers.cleanuparr.entrypoints: "websecure"
      traefik.http.routers.cleanuparr.tls: "true"
      traefik.http.services.cleanuparr.loadbalancer.server.port: "11011"
      mediastack.desc: "strikes stalled downloads, cleans up the queue"
      mediastack.vpn: "false"
      mediastack.config: "true"
      mediastack.subdomain: "cleanup"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs --max-time 5 http://127.0.0.1:11011/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [mediastack]
    logging: *logging
    restart: unless-stopped
