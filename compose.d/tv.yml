# TV profile: ErsatzTV — virtual live-TV channels from your library.

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-armour: &no-foreign-watchtower
  com.centurylinklabs.watchtower.enable: "false"

services:
  ersatztv:
    image: ghcr.io/ersatztv/ersatztv:latest
    container_name: ${ERSATZTV_NAME:-mediastack-ersatztv}
    profiles: ["tv"]
    environment:
      - TZ=${TZ}
    ports:
      - "${ERSATZTV_PORT:-8409}:8409"
    volumes:
      - ${CONFIG_ROOT}/ersatztv:/config
      - ${DATA_ROOT}/media:/media:ro
    labels:
      <<: *no-foreign-watchtower
      mediastack.managed: "true"
      mediastack.vpn: "false"
      mediastack.config: "true"
      mediastack.subdomain: "tv"
    networks: [mediastack]
    logging: *logging
    restart: unless-stopped
