# Tunnel profile: Cloudflare tunnel for WAN exposure without port-forwarding.

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-armour: &no-foreign-watchtower
  com.centurylinklabs.watchtower.enable: "false"

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ${CLOUDFLARED_NAME:-mediastack-cloudflared}
    profiles: ["tunnel"]
    command: tunnel run
    environment:
      - TZ=${TZ}
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    labels:
      <<: *no-foreign-watchtower
      mediastack.managed: "true"
      mediastack.vpn: "false"
      mediastack.config: "false"
    networks: [mediastack]
    logging: *logging
    restart: unless-stopped
