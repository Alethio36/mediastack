# Transmission: extra torrent client. Most deployments want exactly ONE torrent client
# (qBittorrent). Enable only if you know why. Peer-port note: 6881 is mapped
# once on gluetun; configure distinct listen ports per client if you run
# several.

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-armour: &no-foreign-watchtower
  com.centurylinklabs.watchtower.enable: "false"

services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: ${TRANSMISSION_NAME:-mediastack-transmission}
    profiles: ["transmission"]
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${TRANSMISSION_UID}
      - PGID=${MEDIA_GROUP_GID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/transmission:/config
      - ${DATA_ROOT}/torrent:/data/torrent
    labels:
      <<: *no-foreign-watchtower
      mediastack.managed: "true"
      mediastack.desc: "extra torrent client (most people do not need it)"
      mediastack.vpn: "true"
      mediastack.config: "true"
      mediastack.subdomain: "transmission"
    healthcheck:
      # / returns 401 unauthenticated; curl without -f still exits 0 = server up.
      test: ["CMD-SHELL", "curl -s --max-time 5 http://127.0.0.1:9091 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *logging
    restart: unless-stopped
