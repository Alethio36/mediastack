# WatchState: play-state hub — syncs and backs up per-user watch state
# across media servers (this stack's Jellyfin and any others you add) by
# metadata GUIDs, not server-internal IDs, so state survives rebuilds and
# path changes. Backends are configured once in its UI (like Wizarr's
# first run); wire has no role here. One instance per household — a
# second instance is a second state database and defeats the point.

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-armour: &no-foreign-watchtower
  com.centurylinklabs.watchtower.enable: "false"

services:
  watchstate:
    image: ghcr.io/arabcoders/watchstate:latest
    container_name: ${WATCHSTATE_NAME:-mediastack-watchstate}
    profiles: ["watchstate"]
    # rootless image: runs as, and must own /config as, this user
    user: "${WATCHSTATE_UID}:${MEDIA_GROUP_GID}"
    environment:
      - WS_TZ=${TZ}
    ports:
      - "${WATCHSTATE_PORT:-8080}:8080"
    volumes:
      - ${CONFIG_ROOT}/watchstate:/config
    labels:
      <<: *no-foreign-watchtower
      mediastack.managed: "true"
      mediastack.port: "8080"
      traefik.enable: "true"
      traefik.http.routers.watchstate.rule: "Host(`${WATCHSTATE_HOST:-watch}.${TRAEFIK_DOMAIN:-unset.invalid}`)"
      traefik.http.routers.watchstate.entrypoints: "websecure"
      traefik.http.routers.watchstate.tls: "true"
      traefik.http.services.watchstate.loadbalancer.server.port: "8080"
      mediastack.desc: "syncs + backs up per-user watch state across media servers"
      mediastack.vpn: "false"
      mediastack.config: "true"
      mediastack.subdomain: "watch"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs --max-time 5 http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [mediastack]
    logging: *logging
    restart: unless-stopped
