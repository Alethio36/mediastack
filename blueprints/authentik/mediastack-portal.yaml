# The portal's setup, applied by authentik's worker on every start
# (compose.d/authentik.yml mounts a copy; lib/authentik.sh keeps it current).
# Values that differ per install come from the worker's environment (!Env).
#
# Household members are INTERNAL users without admin rights: authentik shows
# its app dashboard to internal users only (external users are sent to one
# default app). They join by invitation and land in `media-users`; `admins`
# is the group the gate lets into the admin tools.
version: 1
metadata:
  name: Mediastack - Portal
  labels:
    blueprints.goauthentik.io/description: "mediastack: groups, sign-up by invitation, the portal's name"
entries:
  # -- groups -------------------------------------------------------------
  - model: authentik_core.group
    id: group-media-users
    identifiers:
      name: media-users
    attrs:
      is_superuser: false
  - model: authentik_core.group
    id: group-admins
    identifiers:
      name: admins
    attrs:
      is_superuser: false

  # -- the portal's name --------------------------------------------------
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      branding_title: !Env [MEDIASTACK_PORTAL_TITLE, Mediastack]

  # -- sign-up by invitation ----------------------------------------------
  - model: authentik_flows.flow
    id: flow-join
    identifiers:
      slug: mediastack-join
    attrs:
      name: mediastack - join by invitation
      title: !Format ["Join %s", !Env [MEDIASTACK_PORTAL_TITLE, Mediastack]]
      designation: enrollment
      authentication: require_unauthenticated

  - model: authentik_stages_invitation.invitationstage
    id: stage-invitation
    identifiers:
      name: mediastack-join-invitation
    attrs:
      continue_flow_without_invitation: false

  - model: authentik_stages_prompt.prompt
    id: field-welcome
    identifiers:
      name: mediastack-join-welcome
    attrs:
      field_key: welcome
      label: Welcome
      type: static
      required: false
      initial_value: !Format
        - "You've been invited to %s. Choose a username and password: they are your login for every app here — the same ones in the Jellyfin app on your TV or phone. Your email is how you'll reset a forgotten password."
        - !Env [MEDIASTACK_PORTAL_TITLE, Mediastack]
      order: 0
  - model: authentik_stages_prompt.prompt
    id: field-username
    identifiers:
      name: mediastack-join-username
    attrs:
      field_key: username
      label: Username
      type: username
      required: true
      placeholder: Username
      order: 1
  - model: authentik_stages_prompt.prompt
    id: field-password
    identifiers:
      name: mediastack-join-password
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: Password
      order: 2
  - model: authentik_stages_prompt.prompt
    id: field-password-repeat
    identifiers:
      name: mediastack-join-password-repeat
    attrs:
      field_key: password_repeat
      label: Password (again)
      type: password
      required: true
      placeholder: Password (again)
      order: 3
  - model: authentik_stages_prompt.prompt
    id: field-name
    identifiers:
      name: mediastack-join-name
    attrs:
      field_key: name
      label: Your name
      type: text
      required: true
      placeholder: How you'd like to be shown
      order: 4
  - model: authentik_stages_prompt.prompt
    id: field-email
    identifiers:
      name: mediastack-join-email
    attrs:
      field_key: email
      label: Email
      type: email
      required: true
      placeholder: For password resets
      order: 5

  # one page: the welcome text describes every field it sits above
  - model: authentik_stages_prompt.promptstage
    id: stage-credentials
    identifiers:
      name: mediastack-join-credentials
    attrs:
      fields:
        - !KeyOf field-welcome
        - !KeyOf field-username
        - !KeyOf field-password
        - !KeyOf field-password-repeat
        - !KeyOf field-name
        - !KeyOf field-email
  # the earlier second page — removed (its binding goes with it)
  - model: authentik_stages_prompt.promptstage
    state: absent
    identifiers:
      name: mediastack-join-details

  - model: authentik_stages_user_write.userwritestage
    id: stage-write
    identifiers:
      name: mediastack-join-write
    attrs:
      user_creation_mode: always_create
      user_type: internal
      user_path_template: users/household
      create_users_group: !KeyOf group-media-users
  - model: authentik_stages_user_login.userloginstage
    id: stage-login
    identifiers:
      name: mediastack-join-login

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-join
      stage: !KeyOf stage-invitation
      order: 5
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-join
      stage: !KeyOf stage-credentials
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-join
      stage: !KeyOf stage-write
      order: 20
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-join
      stage: !KeyOf stage-login
      order: 100

  # -- the first card on the dashboard ------------------------------------
  # No login behind it (an application needs no provider): it carries the
  # setup text until the apps' own cards arrive with them.
  - model: authentik_core.application
    identifiers:
      slug: mediastack-getting-started
    attrs:
      name: Getting started
      group: Start here
      meta_launch_url: !Format ["%s/if/user/", !Env [MEDIASTACK_PORTAL_URL, ""]]
      meta_publisher: !Env [MEDIASTACK_PORTAL_TITLE, Mediastack]
      meta_description: "Your username and password here work in every app. Watch: install the Jellyfin app and sign in with them. Request something new: use the Requests card and sign in with Jellyfin."
      open_in_new_tab: false

  # -- the gate: one rule for every admin tool ----------------------------
  # Traefik asks authentik (the forward-auth provider, attached to the
  # built-in outpost by `wire authentik`) about every request to a route
  # marked mediastack.auth: gate. Domain-wide: one login covers them all; the
  # application's binding lets `admins` through and nobody else.
  - model: authentik_providers_proxy.proxyprovider
    id: provider-gate
    identifiers:
      name: mediastack-gate
    attrs:
      mode: forward_domain
      external_host: !Env [MEDIASTACK_PORTAL_URL, ""]
      cookie_domain: !Env [MEDIASTACK_DOMAIN, ""]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    id: app-gate
    identifiers:
      slug: mediastack-admin-tools
    attrs:
      name: Admin tools
      provider: !KeyOf provider-gate
      # not a card itself: each gated tool gets its own card (wire authentik)
      meta_launch_url: blank://blank
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-gate
      group: !KeyOf group-admins
      order: 0

  # -- LDAP: how Jellyfin checks a password -------------------------------
  # authentik's own LDAP front door (the mediastack-ldap outpost, a member of
  # the shard). Binds run a flow with no MFA step — TV and phone apps send a
  # username and password and cannot answer a prompt — throttled by a
  # reputation policy (authentik's brute-force protection). Only the search
  # account may list the directory; only media-users and admins may bind.
  - model: authentik_policies_reputation.reputationpolicy
    id: policy-ldap-reputation
    identifiers:
      name: mediastack-ldap-reputation
    attrs:
      check_ip: true
      check_username: true
      threshold: -5
  - model: authentik_stages_password.passwordstage
    id: stage-ldap-password
    identifiers:
      name: mediastack-ldap-password
    attrs:
      backends:
        - authentik.core.auth.InbuiltBackend
        - authentik.core.auth.TokenBackend
  - model: authentik_stages_identification.identificationstage
    id: stage-ldap-identification
    identifiers:
      name: mediastack-ldap-identification
    attrs:
      user_fields: [username]
      password_stage: !KeyOf stage-ldap-password
  - model: authentik_stages_user_login.userloginstage
    id: stage-ldap-login
    identifiers:
      name: mediastack-ldap-login
  - model: authentik_flows.flow
    id: flow-ldap
    identifiers:
      slug: mediastack-ldap-bind
    attrs:
      name: mediastack - LDAP bind (no MFA)
      title: LDAP
      designation: authentication
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-ldap
      stage: !KeyOf stage-ldap-identification
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-ldap
      stage: !KeyOf stage-ldap-login
      order: 30
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf flow-ldap
      policy: !KeyOf policy-ldap-reputation
      order: 0

  - model: authentik_core.user
    id: user-ldap-search
    identifiers:
      username: mediastack-ldap-search
    attrs:
      name: mediastack LDAP search (Jellyfin)
      path: services
      type: internal
      password: !Env [MEDIASTACK_LDAP_BIND_PASSWORD, ""]

  - model: authentik_providers_ldap.ldapprovider
    id: provider-ldap
    identifiers:
      name: mediastack-ldap
    attrs:
      base_dn: dc=ldap,dc=mediastack
      authentication_flow: !KeyOf flow-ldap
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      search_mode: cached
      bind_mode: cached
      mfa_support: false
    # the full name: authentik validates a blueprint in a dry run first, where
    # the short form fails as a "global" permission (found live, 2026.8); on
    # the real apply it is still granted on this provider only
    permissions:
      - permission: authentik_providers_ldap.search_full_directory
        user: !KeyOf user-ldap-search
  - model: authentik_core.application
    id: app-ldap
    identifiers:
      slug: mediastack-ldap
    attrs:
      name: LDAP (Jellyfin)
      provider: !KeyOf provider-ldap
      meta_launch_url: blank://blank
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-ldap
      group: !KeyOf group-media-users
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-ldap
      group: !KeyOf group-admins
      order: 1
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-ldap
      user: !KeyOf user-ldap-search
      order: 2

  - model: authentik_outposts.outpost
    id: outpost-ldap
    identifiers:
      name: mediastack-ldap
    attrs:
      type: ldap
      providers:
        - !KeyOf provider-ldap
