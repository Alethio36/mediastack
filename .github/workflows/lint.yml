name: lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck -S warning -x mediastack.sh lib/*.sh scripts/*.sh
      - name: front-door safety audit
        run: bash scripts/audit-frontdoor-safety.sh
      - name: no placeholder host literals
        run: |
          # an escaped \${X_HOST:-...} in script output is a host placeholder printed verbatim
          if grep -rnE '<this-host>|<this_host>|<your-host>|\\\$\{[A-Z0-9_]+_HOST:-' mediastack.sh lib/*.sh; then
            echo "::error::placeholder host literal in a runtime string — use svc_url or a real host expression"
            exit 1
          fi
      - name: every registry verb is documented in README
        run: |
          rc=0
          for v in $(awk -F'~' '/^    "[a-z-]+~/ {sub(/^ *"/,"",$1); print $1}' mediastack.sh); do
            grep -qE "\`$v( |\`)" README.md || { echo "::error::verb '$v' is in the registry but not mentioned in README.md"; rc=1; }
          done
          exit $rc
      - name: dispatch contracts (scripts/test-dispatch.sh)
        run: scripts/test-dispatch.sh
      - name: media manifest loss-vs-churn contract (scripts/test-manifest.sh)
        run: scripts/test-manifest.sh
      - name: UID ownership handover contract (scripts/test-handover.sh)
        run: scripts/test-handover.sh
      - name: the health-verdict wait outlasts every healthcheck window (scripts/check-start-wait.sh)
        run: scripts/check-start-wait.sh
      - name: health verdict contract (scripts/test-verdict.sh)
        run: scripts/test-verdict.sh
      - name: API readiness contract (scripts/test-http-ready.sh)
        run: scripts/test-http-ready.sh
      - name: newest restore point, never pre-update/ or manifest/ (scripts/test-restore-point.sh)
        run: scripts/test-restore-point.sh
      - name: every arr type has every per-type fact (scripts/test-arr-meta.sh)
        run: scripts/test-arr-meta.sh
      - name: the panel's wrapper passes every button and nothing else (scripts/test-frontdoor.sh)
        run: scripts/test-frontdoor.sh
      - name: app-to-app addresses follow the target's VPN side (scripts/test-addr.sh)
        run: scripts/test-addr.sh
      - name: a VPN toggle re-points every caller of the moved service (scripts/test-repoint.sh)
        run: scripts/test-repoint.sh
      - name: repo state stays the operator's, whoever ran the script (scripts/test-ownership.sh)
        run: scripts/test-ownership.sh
      - name: upgrade's verdict is Docker's, given by the pulled code (scripts/test-upgrade.sh)
        run: scripts/test-upgrade.sh
      - name: deletion attribution's host contract (scripts/test-audit.sh)
        run: scripts/test-audit.sh
      - name: everything outside the repo is in the footprint registry (scripts/test-footprint.sh)
        run: scripts/test-footprint.sh
      - name: where things live — the layout move and your compose files (scripts/test-layout.sh)
        run: scripts/test-layout.sh
      - name: the arr recycle bin's contract (scripts/test-recycle.sh)
        run: scripts/test-recycle.sh
      - name: no literal backslash-n in notification bodies
        run: |
          # a double-quoted \n is two characters to bash: Discord shows '\n'.
          # Line breaks go in as $'\n' (or printf's \n inside $(printf ...)).
          if grep -nE 'notify(_interruption)? [a-z]+ "[^"]*" "[^"]*\\n' mediastack.sh lib/*.sh | grep -v '\$(printf'; then
            echo "::error::literal \\n in a notification body — use \$'\\n'"
            exit 1
          fi
      - name: compose renders across the override lifecycle (scripts/test-render.sh)
        run: scripts/test-render.sh
      - name: schema bump enforced
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}" -- .env.example | grep -q .; then
            git diff "origin/${{ github.base_ref }}" -- .env.example | grep -q '^[+-]ENV_SCHEMA=' \
              || { echo "::error::.env.example changed without bumping ENV_SCHEMA (and adding a migration)"; exit 1; }
          fi
