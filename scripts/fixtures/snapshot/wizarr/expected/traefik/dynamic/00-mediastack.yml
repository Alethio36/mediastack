# GENERATED by mediastack traefik-setup — DO NOT EDIT.
# The dashboard router is also the single wildcard-cert requester: every
# other router says tls=true and reuses the cert issued here.
http:
  routers:
    dashboard:
      rule: "Host(`dash.media.example.com`)"
      entryPoints: [websecure]
      service: api@internal
      middlewares: [dash-auth]
      tls:
        certResolver: le
        domains:
          - main: "media.example.com"
            sans: ["*.media.example.com"]
  middlewares:
    dash-auth:
      basicAuth:
        users:
          - "admin:$apr1$bf0a5f2d$7f6PtumtZOjTIXmXb3p5K/"
    mediastack-strip:
      headers:
        customRequestHeaders:
          X-authentik-username: ""
          X-authentik-groups: ""
          X-authentik-email: ""
          X-authentik-name: ""
          X-authentik-uid: ""
          X-authentik-jwt: ""
    mediastack-gate:
      headers:
        customResponseHeaders:
          X-Mediastack-Gate: "off"
tcp:
  middlewares:
    # the LDAP route answers the stack network only — never the LAN
    mediastack-ldap-allow:
      ipAllowList:
        sourceRange: ["172.31.250.0/24"]
